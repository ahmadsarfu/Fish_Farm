spring.application.name=fish-farm-management

server.port=${PORT:8080}
server.address=0.0.0.0

#mysql
spring.main.banner-mode=off
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=${MYSQL_AUTH_URL:jdbc:mysql://localhost}:${MYSQL_AUTH_PORT:3306}/${MYSQL_AUTH_DB:fish_farm_db}?useSSL=false&useUnicode=yes&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false







# Session authentication. Set APP_COOKIE_SECURE=true behind HTTPS in production.
app.cookie-secure=${APP_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}
server.servlet.session.timeout=8h
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4174}
app.legacy-setup-token=${FARM_SETUP_TOKEN:}

app.business-zone=${FARM_TIME_ZONE:Asia/Kolkata}
server.servlet.session.tracking-modes=cookie

# Commercial onboarding. Production disables open farm registration by default.
app.public-registration-enabled=${PUBLIC_REGISTRATION_ENABLED:true}
app.platform-bootstrap-enabled=${PLATFORM_BOOTSTRAP_ENABLED:false}
app.platform-admin-username=${PLATFORM_ADMIN_USERNAME:}
app.platform-admin-password=${PLATFORM_ADMIN_PASSWORD:}
app.platform-totp-secret=${PLATFORM_ADMIN_TOTP_SECRET:}
